<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>الكورسات | منصة المهندس إبراهيم محمد</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body data-logged-in="{{ 'true' if user else 'false' }}">
	<header class="navbar">
		<div class="nav-container">
			<button class="menu-btn" type="button">☰</button>
			<a href="{{ url_for('home') }}" class="logo">
				<img class="logo-img" src="{{ url_for('static', filename='images/logo.png') }}" alt="EM Logo">
			</a>
			<div class="nav-sign">
				<img class="menu-icon" src="{{ url_for('static', filename='icons/bars-solid-full.svg') }}" alt="Menu Icon">
			</div>
			<nav class="nav-links">
				<a href="{{ url_for('courses') }}">الكورسات</a>
				<a href="{{ url_for('tools') }}">الأدوات</a>
				<a href="{{ url_for('challenges') if user else url_for('login') }}">التحديات</a>
				<a href="{{ url_for('reports') if user else url_for('login') }}">التقارير</a>
				<a href="{{ url_for('forum') if user else url_for('login') }}">المنتدى</a>
			</nav>
			<div class="nav-user">
				<div class="user-profile">
				{% if user %}
					<a href="{{ url_for('dashboard') }}" class="user-name">أهلاً، {{ user.name }}</a>
					<a href="{{ url_for('logout') }}" class="logout-link">تسجيل الخروج</a>
				{% else %}
					<a href="{{ url_for('login') }}" class="user-name">تسجيل الدخول</a>
				{% endif %}
				</div>
			</div>
		</div>
	</header>

	<aside class="sidebar">
		<button class="close-btn" type="button">×</button>
		<div class="mobile-links">
			<a href="{{ url_for('courses') }}">الكورسات</a>
			<a href="{{ url_for('tools') }}">الأدوات</a>
			<a href="{{ url_for('challenges') if user else url_for('login') }}">التحديات</a>
			<a href="{{ url_for('reports') if user else url_for('login') }}">التقارير</a>
			<a href="{{ url_for('forum') if user else url_for('login') }}">المنتدى</a>
		</div>
	</aside>
	<div class="overlay"></div>

	<main>
		<section class="courses-page">
			<div class="page-head">
				<h1>الكورسات المتاحة</h1>
				<p>اختار الصف الدراسي وشوف الباقات المناسبة ليك</p>
			</div>

			<div class="filter-bar" id="filterBar">
				<button class="filter-pill active" data-grade="all" type="button">الكل</button>
				<button class="filter-pill" data-grade="first" type="button">الصف الأول الثانوي</button>
				<button class="filter-pill" data-grade="second" type="button">الصف الثاني الثانوي</button>
				<button class="filter-pill" data-grade="third" type="button">الصف الثالث الثانوي</button>
			</div>

			<div class="cards-grid" id="cardsGrid"></div>
		</section>
	</main>

	<div id="codeModalOverlay" class="modal-overlay">
		<div class="modal-box">
			<button id="closeModal" class="modal-close" type="button">✕</button>
			<h3>إشترك في الكورس</h3>
			<p id="modalCourseTitle" class="modal-course-title"></p>
			<input id="codeInput" type="text" placeholder="اكتب كود الاشتراك هنا" maxlength="20">
			<div id="codeError" class="code-error"></div>
			<button id="submitCodeBtn" class="subscribe-btn" type="button">تأكيد الكود</button>
		</div>
	</div>

	<script id="courseData" type="application/json">{{ courses | tojson }}</script>
	<script>
		const packages = JSON.parse(document.getElementById('courseData').textContent);
		const grid = document.getElementById('cardsGrid');
		const filterBar = document.getElementById('filterBar');
		const modal = document.getElementById('codeModalOverlay');
		const codeInput = document.getElementById('codeInput');
		const codeError = document.getElementById('codeError');
		const isLoggedIn = document.body.dataset.loggedIn === 'true';
		let activeCourseId = null;

		function renderCards(grade = 'all') {
			const courses = grade === 'all' ? packages : packages.filter(course => course.grade === grade);
			grid.innerHTML = courses.length ? courses.map(course => `
				<article class="card">
					<div class="card-image" style="background:${course.image ? `url('${course.image}') center/cover` : course.gradient}"></div>
					<div class="card-body">
						<div class="card-tags"><h3 class="card-title">${course.title}</h3><span class="grade-tag">${course.gradeLabel}</span></div>
						<div class="card-date">📅 ${course.date || ''}</div>
						<div class="price-box"><span class="price-new">${course.newPrice} <span class="price-currency">ج.م</span></span></div>
						<button class="subscribe-btn ${course.subscribed ? 'is-subscribed' : ''}" data-id="${course.id}" data-title="${course.title}" data-subscribed="${course.subscribed}" type="button">${course.subscribed ? '✓ مشترك - فتح الكورس' : '🛒 إشترك الآن'}</button>
					</div>
				</article>`).join('') : '<div class="no-results">مفيش باقات متاحة للصف ده حاليًا</div>';
		}

		filterBar.addEventListener('click', event => {
			const button = event.target.closest('.filter-pill');
			if (!button) return;
			filterBar.querySelectorAll('.filter-pill').forEach(item => item.classList.remove('active'));
			button.classList.add('active');
			renderCards(button.dataset.grade);
		});

		grid.addEventListener('click', event => {
			const button = event.target.closest('.subscribe-btn');
			if (!button) return;
			if (!isLoggedIn) {
				window.location.href = "{{ url_for('login') }}";
				return;
			}
			if (button.dataset.subscribed === 'true') {
				window.location.href = `/course/${button.dataset.id}/content`;
				return;
			}
			activeCourseId = Number(button.dataset.id);
			document.getElementById('modalCourseTitle').textContent = button.dataset.title;
			codeInput.value = '';
			codeError.textContent = '';
			modal.classList.add('open');
			codeInput.focus();
		});

		function closeModal() { modal.classList.remove('open'); activeCourseId = null; }
		document.getElementById('closeModal').addEventListener('click', closeModal);
		modal.addEventListener('click', event => { if (event.target === modal) closeModal(); });
		document.getElementById('submitCodeBtn').addEventListener('click', async () => {
			if (!codeInput.value.trim()) { codeError.textContent = 'من فضلك اكتب الكود'; return; }
			const response = await fetch('/api/verify-code', {
				method: 'POST',
				headers: {'Content-Type': 'application/json'},
				body: JSON.stringify({course_id: activeCourseId, code: codeInput.value.trim()})
			});
			const result = await response.json();
			if (result.success) window.location.href = result.redirect_url;
			else codeError.textContent = result.message || 'الكود غير صحيح';
		});
		renderCards();
	</script>
	<script src="{{ url_for('static', filename='js/main.js') }}"></script>





    
<footer class="footer">

    <!-- Social Media -->
    


    <!-- Contact Section -->

        <div class="footer-social">

        <a href="#" class="social-icon">
            <i class="fa-brands fa-whatsapp"></i>

        <a href="#" class="social-icon">

        <a href="#" class="social-icon">
            <i class="fa-brands fa-instagram"></i>
        </a>

        <a href="#" class="social-icon">
            <i class="fa-brands fa-facebook-f"></i>
        </a>

    </div><!-- Location -->
        <div class="contact-item">

            <div class="contact-text">
                <span>موقعنا</span>
                <strong>القاهرة، مصر</strong>
            </div>

            <div class="contact-icon location">
                <i class="fa-solid fa-location-dot"></i>
            </div>

        </div>


        <!-- Email -->
        


        <!-- Phone -->
        <div class="contact-item">

            <div class="contact-text">
                <span>اتصل بنا</span>
                <strong>+20 1092677450</strong>
            </div>

            <div class="contact-icon phone">
                <i class="fa-solid fa-phone"></i>
            </div>

        </div>

    </div>

</footer>
</body>
</html>
