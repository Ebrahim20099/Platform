<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيت كلمة المرور</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="register-container">
        <section class="register-form">
            <h2>نسيت كلمة المرور</h2>
            {% if success %}
                <p class="form-success">{{ success }}</p>
                {% if reset_link %}
                    <p class="form-link"><a href="{{ reset_link }}">فتح الرابط</a></p>
                {% endif %}
            {% endif %}
            <form method="POST">
                <div class="input-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                </div>
                <button class="buttonn" type="submit">إرسال رابط الاستعادة</button>
                <p class="login-link"><a href="{{ url_for('login') }}">عودة لتسجيل الدخول</a></p>
            </form>
        </section>
    </main>
</body>
</html>
