services:
  - type: web
    name: platform-web
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: platform-db
          property: connectionString

  - type: pserv
    name: platform-db
    plan: free
    databaseName: platform
    postgresMajorVersion: "16"
